name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Resolve version and target
        shell: bash
        run: |
          node -p "process.version + ' ' + process.platform + '-' + process.arch"
          echo "BMA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BMA_TARGET=$(echo '${{ runner.os }}-${{ runner.arch }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Install gpg
        if: runner.os == 'macOS'
        run: command -v gpg || brew install gnupg
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package with the verified official Node.js build
        if: runner.os == 'macOS'
        run: cargo run -p bma-packager --release -- build --out dist/bin --official-node
      - name: Package with the verified official Node.js build
        if: runner.os == 'Windows'
        shell: bash
        run: cargo run -p bma-packager --release -- build --out dist/bin --official-node --gpg "C:/Program Files/Git/usr/bin/gpg.exe"
      - name: Archive
        shell: bash
        run: |
          name="bma-${BMA_VERSION}-${BMA_TARGET}"
          mkdir -p "dist/release/${name}"
          cp dist/bin/bma* dist/bin/THIRD_PARTY_LICENSES.txt LICENSE "dist/release/${name}/"
          cd dist/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi
          rm -rf "${name}"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ env.BMA_TARGET }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: |
          sha256sum bma-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release/bma-*
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
